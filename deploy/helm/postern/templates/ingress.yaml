{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "postern.fullname" . }}
  labels:
    {{- include "postern.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    {{- if .Values.acme.createIssuer }}
    cert-manager.io/issuer: {{ include "postern.issuerName" . | quote }}
    {{- else if .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- end }}
    {{- if contains "nginx" .Values.ingress.className }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ printf "%dm" (add (int .Values.maxUploadMb) 2) | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "postern.tlsSecretName" . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "postern.fullname" . }}
                port:
                  name: http
{{- end }}
