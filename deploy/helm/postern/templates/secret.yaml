{{- if not .Values.secretKey.existingSecret }}
{{- $name := include "postern.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "postern.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.secretKey.value }}
  secret-key: {{ .Values.secretKey.value | b64enc | quote }}
  {{- else if and $existing $existing.data (index $existing.data "secret-key") }}
  secret-key: {{ index $existing.data "secret-key" | quote }}
  {{- else }}
  secret-key: {{ randAlphaNum 64 | sha256sum | b64enc | quote }}
  {{- end }}
{{- end }}
