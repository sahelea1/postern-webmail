[package]
name = "postern"
version = "0.2.0"
description = "A small, stateless webmail gateway for IMAP and JMAP servers"
publish = false
edition = "2024"

[dependencies]
aes = "0.9.4"
ammonia = "4.2.5"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.92"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23.1"
bytes = "1.12.2"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
des = "0.9.0"
futures = "0.3.34"
getrandom = "0.4.3"
mail-builder = "2.0.1"
mail-parser = "0.11.9"
p12-keystore = "0.4.1"
mail-send = { version = "0.7.0", default-features = false, features = ["ring"] }
percent-encoding = "2.3.2"
ring = "0.17.14"
rsa = { version = "0.10.0", default-features = false, features = ["std", "encoding", "pkcs1v15", "sha1", "getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rustls-webpki = { version = "0.103.17", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }
utf7-imap = "0.3.2"
webpki-roots = "1.0.12"
x509-parser = "0.18"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
overflow-checks = true
